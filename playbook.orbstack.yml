#!/usr/bin/env ansible-playbook
---
- name: setup an ansible development environment on macOS via OrbStack
  hosts: orbstack
  become: yes
  gather_facts: no

  pre_tasks:
    # Create the OrbStack machine on the Mac if it does not exist yet; the
    # connection facts in inventory/host_vars/ansible-dev.yml depend on the
    # machine being named exactly `ansible-dev` (OrbStack selects it by the
    # `user@machine` SSH user). ansible_host is `localhost`, so the machine
    # name is taken from the SSH user (root@ansible-dev).
    - name: check whether the OrbStack machine exists (on the Mac)
      ansible.builtin.shell: >
        orb list | awk -v m='{{ ansible_user | default('root@ansible-dev') | split('@') | last }}'
        '$1==m {found=1} END {exit found?0:1}'
      delegate_to: localhost
      become: false
      register: orb_machine_check
      failed_when: false
      changed_when: false

    - name: create the OrbStack machine (on the Mac)
      ansible.builtin.command: >-
        orb create fedora
        {{ ansible_user | default('root@ansible-dev') | split('@') | last }}
      delegate_to: localhost
      become: false
      when: orb_machine_check.rc != 0

    - name: wait for the OrbStack machine to be running
      ansible.builtin.shell: >
        orb list | awk -v m='{{ ansible_user | default('root@ansible-dev') | split('@') | last }}'
        '$1==m {print $2}'
      delegate_to: localhost
      become: false
      register: orb_machine_state
      until: orb_machine_state.stdout == 'running'
      retries: 30
      delay: 5
      changed_when: false
      when: orb_machine_check.rc != 0

  roles:
    - robertdebock.bootstrap
    - robertdebock.update
    - robertdebock.fail2ban
    - robertdebock.common
    - robertdebock.buildtools
    - robertdebock.epel
    - robertdebock.python_pip
    - robertdebock.users
    - robertdebock.skeleton
    - robertdebock.postfix
    - robertdebock.investigate
    - robertdebock.ansible
    - robertdebock.ansible_lint
    - robertdebock.molecule
    - robertdebock.ara

  tasks:
    # Shared folder from the Mac into the laurent home (host_vars/ansible-dev.yml
    # `shared_folder`). OrbStack's per-machine `mounts` config only applies to
    # isolated machines, so bind-mount the virtiofs Mac path natively instead.
    # Runs after the users role, so /home/laurent exists.
    - name: Ensure the shared folder exists on the Mac
      ansible.builtin.file:
        path: "{{ shared_folder.mac_src }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      when: shared_folder is defined

    # One-shot cleanup for machines migrated from the old g2g user: unmount and
    # drop the stale /home/g2g/Work fstab entry so only the new /home/laurent/Work
    # bind remains (two entries for the same Mac source would be confusing). No-op
    # on a fresh machine that never had g2g.
    - name: Remove the pre-rename g2g shared-folder bind mount if present
      ansible.posix.mount:
        path: /home/g2g/Work
        state: absent
      when: shared_folder is defined

    - name: Ensure the shared folder mount point exists in the machine
      ansible.builtin.file:
        path: "{{ shared_folder.linux_dst }}"
        state: directory
        owner: laurent
        group: laurent
        mode: "0755"
      when: shared_folder is defined

    # Plain `bind,nofail` (no x-systemd.automount): systemd mounts it eagerly at
    # boot and `findmnt`/`state: mounted` reflect the real bind, so the verify
    # task below cannot pass on a lazy automount entry alone. `nofail` keeps the
    # boot intact if the virtiofs source is not ready yet; re-running the
    # playbook (or `mount --bind`) re-establishes it in that edge case.
    - name: Persist the shared folder bind mount in fstab
      ansible.posix.mount:
        path: "{{ shared_folder.linux_dst }}"
        src: "{{ shared_folder.mac_src }}"
        fstype: none
        opts: "bind,nofail"
        dump: "0"
        passno: "0"
        state: present
      when: shared_folder is defined

    - name: Mount the shared folder now
      ansible.posix.mount:
        path: "{{ shared_folder.linux_dst }}"
        src: "{{ shared_folder.mac_src }}"
        fstype: none
        opts: "bind,nofail"
        state: mounted
      when: shared_folder is defined

    - name: Verify the shared folder is mounted in the machine
      ansible.builtin.command: findmnt {{ shared_folder.linux_dst }}
      register: shared_folder_mount
      changed_when: false
      failed_when: shared_folder_mount.rc != 0
      when: shared_folder is defined

    # Copy (not symlink) the repo's ansible.cfg to the dev user's home as
    # ~/.ansible.cfg so the role_skeleton, the yaml result format and
    # host_key_checking=no apply from any CWD, not only inside the repo dir.
    # A copy goes stale when the repo file changes; re-running the playbook
    # re-syncs it. The relative paths in it (inventory=, roles_path=) resolve
    # against the CWD, and a config in the CWD itself still takes precedence.
    - name: copy the repo ansible.cfg to the dev user home as .ansible.cfg
      ansible.builtin.copy:
        src: ansible.cfg
        dest: /home/laurent/.ansible.cfg
        owner: laurent
        group: laurent
        mode: "0644"

    # The vendored robertdebock.ara role (2018/2019 era) writes its config to
    # [ara] in ansible.cfg and relies on ara's old default port 9191. Modern
    # ara (1.8) instead reads ~/.ara/server/settings.yaml and its runserver now
    # binds 127.0.0.1:8000, so the UI is not reachable. Restore the intended
    # 0.0.0.0:9191 from here (core file, no vendored-role edits).
    - name: ensure the ara server directory exists
      ansible.builtin.file:
        path: /root/.ara/server
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: generate an ara secret key
      ansible.builtin.command: python3 -c "import secrets; print(secrets.token_hex(50))"
      register: ara_secret_key
      changed_when: no

    - name: write ara server settings.yaml (modern ara 1.8 config location)
      ansible.builtin.copy:
        dest: /root/.ara/server/settings.yaml
        owner: root
        group: root
        mode: "0644"
        content: |
          default:
            ALLOWED_HOSTS:
              - 127.0.0.1
              - ::1
              - localhost
              - ansible-dev
            BASE_DIR: /root/.ara/server
            BASE_PATH: /
            CORS_ORIGIN_ALLOW_ALL: true
            CSRF_TRUSTED_ORIGINS: []
            DEBUG: false
            DATABASE_ENGINE: django.db.backends.sqlite3
            DATABASE_NAME: /root/.ara/server/ansible.sqlite
            LOG_LEVEL: INFO
            PAGE_SIZE: 100
            READ_LOGIN_REQUIRED: false
            TIME_ZONE: UTC
            WRITE_LOGIN_REQUIRED: false
            SECRET_KEY: "{{ ara_secret_key.stdout }}"

    # ara_binary_location comes from the ara role's vars (RedHat → /usr/local/bin)
    # and matches the ExecStart path the role generated in the unit file.
    - name: apply ara database migrations (modern ara needs its Django schema; the 2019 role never ran this)
      ansible.builtin.command: "{{ ara_binary_location | default('/usr/local/bin') }}/ara-manage migrate"
      register: ara_migrate
      changed_when: "'No migrations to apply' not in ara_migrate.stdout"

    - name: bind the ara runserver to 0.0.0.0:9191 in the systemd unit
      ansible.builtin.lineinfile:
        path: /etc/systemd/system/ara.service
        regexp: '^ExecStart=.*ara-manage runserver.*$'
        line: 'ExecStart={{ ara_binary_location | default("/usr/local/bin") }}/ara-manage runserver 0.0.0.0:9191'
        state: present

    - name: reload systemd and restart ara
      ansible.builtin.systemd:
        name: ara
        daemon_reload: yes
        enabled: yes
        state: restarted

    # Remaining roles after ara, in playbook.yml order. Atom ships only an
    # x86_64 Linux rpm and is EOL, so it cannot install on arm64 and is skipped
    # there (Apple Silicon). git/ruby/travis are architecture independent.
    - name: apply robertdebock.ruby
      ansible.builtin.import_role:
        name: robertdebock.ruby

    - name: apply robertdebock.travis
      ansible.builtin.import_role:
        name: robertdebock.travis

    - name: apply robertdebock.git
      ansible.builtin.import_role:
        name: robertdebock.git

    - name: apply robertdebock.atom (x86_64-only; skipped on arm64)
      ansible.builtin.include_role:
        name: robertdebock.atom
      when:
        - ansible_architecture is not defined or ansible_architecture != "aarch64"
