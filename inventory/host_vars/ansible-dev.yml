---
# Connection facts for an OrbStack Linux machine, reached through OrbStack's
# built-in SSH server (no in-VM sshd / Vagrant required).
# The machine must be named `ansible-dev` (OrbStack selects a machine by the SSH user).
# We connect as root (user@machine) so the bootstrap role's raw package install works.
ansible_host: localhost
ansible_port: 32222
ansible_user: root@ansible-dev
ansible_private_key_file: ~/.orbstack/ssh/id_ed25519
ansible_python_interpreter: /usr/bin/python3
# OrbStack's SSH server lives on the Mac, so skip the bootstrap role's
# wait_for on that port (it would check it from inside the machine and fail).
bootstrap_wait_for_host: no
# The common role reboots when it touches the hostname. The reboot action plugin
# then validates recovery by re-running shell commands (boot_id check, whoami)
# over the existing SSH connection, but the proxied OrbStack connection
# (localhost:32222, user root@ansible-dev) is not re-established after the in-VM
# reboot, so every validation attempt fails and the play burns the 600s
# reboot_timeout before failing. Disable it; apply the pending kernel/package
# update with a manual `orb stop ansible-dev && orb start ansible-dev`.
common_reboot: no

# The `robertdebock.docker` role is omitted on OrbStack (Docker runs natively on
# the Mac via OrbStack, not as an in-VM daemon), so the docker group it would
# create does not exist. Override the user list (host_vars wins over the shared
# group_vars/all.yml) to drop `groups: docker`; the Vagrant path is unaffected.
# The dev user is `laurent` — the same account as on the Mac host, so the shared
# folder below stays uid-consistent — and the old `g2g` account is removed
# (state: absent, home directory kept).
users_user_list:
  - name: laurent
    comment: Laurent G
    group: laurent
    cron_allow: yes
    sudo_options: "ALL=(ALL) NOPASSWD: ALL"
    manage_ssh_key: yes
    copy_private_key: yes
    # Deployed into /home/laurent/.ssh/authorized_keys by the users role. It is the
    # public half of the keypair stored at files/ssh_keys/laurent (renamed from g2g
    # locally — that dir is gitignored). The private key is copied to
    # /home/laurent/.ssh/id_rsa, so the two match and `orb ssh laurent@ansible-dev`
    # works; the role's keygen `creates:` guards see files/ssh_keys/laurent exists
    # and skip regeneration. See the README OrbStack section for the rename step.
    authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICWz/doB8a//PIL1dwkF7vo7SR64U/f95bJqh3MDjOj4 Generated by Ansible role robertdebock.users"
  - name: g2g
    state: absent

# Only the laurent group is created on this host; the user's primary group above
# must exist for the users role's user module. (The shared group_vars/all.yml
# still creates the g2g group for the Vagrant path; this host overrides it.)
users_group_list:
  - name: laurent

# The git role runs its clones as `become_user: git_username` into
# `git_repository_destination`; both point at the laurent account/home since the
# g2g account no longer exists. `git_user_name`/`git_user_email` come from the
# shared group_vars/all.yml and are unchanged (they are the commit identity, not
# the OS user).
git_username: laurent
git_repository_destination: /home/laurent/roles

# Shared folder bind-mounted from the Mac into the machine (laurent home). OrbStack
# exposes the Mac filesystem at its real paths via virtiofs (/Users/...), so the
# in-machine bind source is the Mac path as-is; lookup runs on the controller
# (Mac), resolving to ~/Work. Defined here so the playbook task only applies to
# this host. Note: files created on one side appear on the other owned by that
# side's uid (normal for cross-OS shared folders).
shared_folder:
  mac_src: "{{ lookup('env', 'HOME') }}/Work"
  linux_dst: /home/laurent/Work
