---
# Connection facts for an OrbStack Linux machine, reached through OrbStack's
# built-in SSH server (no in-VM sshd / Vagrant required).
# The machine must be named `ansible-dev` (OrbStack selects a machine by the SSH user).
# We connect as root (user@machine) so the bootstrap role's raw package install works.
ansible_host: localhost
ansible_port: 32222
ansible_user: root@ansible-dev
ansible_private_key_file: ~/.orbstack/ssh/id_ed25519
ansible_python_interpreter: /usr/bin/python3
# OrbStack's SSH server lives on the Mac, so skip the bootstrap role's
# wait_for on that port (it would check it from inside the machine and fail).
bootstrap_wait_for_host: no
# The common role reboots when it touches the hostname. The reboot action plugin
# then validates recovery by re-running shell commands (boot_id check, whoami)
# over the existing SSH connection, but the proxied OrbStack connection
# (localhost:32222, user root@ansible-dev) is not re-established after the in-VM
# reboot, so every validation attempt fails and the play burns the 600s
# reboot_timeout before failing. Disable it; apply the pending kernel/package
# update with a manual `orb stop ansible-dev && orb start ansible-dev`.
common_reboot: no

# The `robertdebock.docker` role is omitted on OrbStack (Docker runs natively on
# the Mac via OrbStack, not as an in-VM daemon), so the docker group it would
# create does not exist. Override the user list (host_vars wins over the shared
# group_vars/all.yml) to drop `groups: docker`; the Vagrant path is unaffected.
users_user_list:
  - name: g2g
    comment: Laurent G
    group: g2g
    cron_allow: yes
    sudo_options: "ALL=(ALL) NOPASSWD: ALL"
    manage_ssh_key: yes
    copy_private_key: yes
    # Deployed into /home/g2g/.ssh/authorized_keys by the users role (generated
    # on the Mac in files/ssh_keys/g2g.pub, matching the copied id_rsa).
    authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICWz/doB8a//PIL1dwkF7vo7SR64U/f95bJqh3MDjOj4 Generated by Ansible role robertdebock.users"
