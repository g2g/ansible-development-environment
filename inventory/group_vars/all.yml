---
bootstrap_wait_for_host: yes

users_group_list:
  - name: g2g

users_ssh_key_directory: files/ssh_keys

users_user_list:
  - name: g2g
    comment: Laurent G
    group: g2g
    groups: docker
    cron_allow: yes
    sudo_options: "ALL=(ALL) NOPASSWD: ALL"
    authorized_key: "ssh-rsa "
    manage_ssh_key: yes
    copy_private_key: yes

firewall_services:
  - name: ssh
  - name: 9191
    proto: tcp

ara_configuration:
  - option: host
    value: 0.0.0.0

git_username: g2g
git_user_name: Laurent G
git_user_email: laurent@guesde.com

git_repository_destination: /home/laurent/roles

git_repositories:
  - repo: https://github.com/robertdebock/ansible-role-ara.git
    dest: ansible-role-ara
  - repo: https://github.com/robertdebock/ansible-role-atom.git
    dest: ansible-role-atom
  - repo: https://github.com/robertdebock/ansible-role-bootstrap.git
    dest: ansible-role-bootstrap
  - repo: https://github.com/robertdebock/ansible-role-buildtools.git
    dest: ansible-role-buildtools
  - repo: https://github.com/robertdebock/ansible-role-common.git
    dest: ansible-role-dnsmasq
  - repo: https://github.com/robertdebock/ansible-role-docker.git
    dest: ansible-role-docker
  - repo: https://github.com/robertdebock/ansible-role-epel.git
    dest: ansible-role-epel
  - repo: https://github.com/robertdebock/ansible-role-fail2ban.git
    dest: ansible-role-fail2ban
  - repo: https://github.com/robertdebock/ansible-role-git.git
    dest: ansible-role-git
  - repo: https://github.com/robertdebock/ansible-role-investigate.git
    dest: ansible-role-investigate
  - repo: https://github.com/robertdebock/ansible-role-molecule.git
    dest: ansible-role-molecule
  - repo: https://github.com/robertdebock/ansible-role-postfix.git
    dest: ansible-role-postfix
  - repo: https://github.com/robertdebock/ansible-role-python_pip.git
    dest: ansible-role-python_pip
  - repo: https://github.com/robertdebock/ansible-role-reboot.git
    dest: ansible-role-reboot
